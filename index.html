<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Русский · Learn Russian</title>
<meta name="description" content="A gamified, class-structured Russian course: alphabet bootcamp, lessons, homework, spaced repetition, and TORFL prep.">
<meta name="theme-color" content="#0f1220">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div id="app">
  <header class="topbar">
    <a href="#/home" class="brand"><span class="brand-mark">Я</span><span class="brand-text">Русский</span></a>
    <div class="topstats">
      <span class="stat" title="Day streak">🔥 <b id="top-streak">0</b></span>
      <span class="stat" title="Total XP">⭐ <b id="top-xp">0</b></span>
      <a href="#/shop" class="stat coins" title="Rubles · tap to open the shop">₽ <b id="top-coins">0</b></a>
      <a href="#/settings" class="icon-btn" aria-label="Settings">⚙️</a>
    </div>
  </header>
  <main id="view" aria-live="polite"></main>
  <nav class="bottomnav" id="nav">
    <a href="#/home" data-route="home"><span class="nav-ico">🏠</span><span>Home</span></a>
    <a href="#/learn" data-route="learn"><span class="nav-ico">🗺️</span><span>Learn</span></a>
    <a href="#/review" data-route="review"><span class="nav-ico">🔁</span><span>Review</span><em class="nav-badge" id="nav-due" hidden></em></a>
    <a href="#/homework" data-route="homework"><span class="nav-ico">📝</span><span>Homework</span><em class="nav-badge" id="nav-hw" hidden></em></a>
    <a href="#/inventory" data-route="inventory"><span class="nav-ico">🎒</span><span>Items</span></a>
    <a href="#/profile" data-route="profile"><span class="nav-ico">🏅</span><span>Profile</span></a>
  </nav>
</div>
<div id="toasts" aria-live="assertive"></div>
<script type="module" src="js/app.js"></script>
</body>
</html>
